services:
  - type: web
    name: email-scheduler-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false        # set manually in Render dashboard
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASS
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: MAX_EMAILS_PER_HOUR
        value: "10"
      - key: WORKER_CONCURRENCY
        value: "2"
      - key: EMAIL_DELAY_MS
        value: "2000"
      - key: FRONTEND_URL
        sync: false        # your Vercel URL e.g. https://email-scheduler.vercel.app
      - key: PORT
        value: "4000"
